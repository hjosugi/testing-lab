name: Security verification

# Issue #24/#48. Abuse-case, traceability, secret, workflow-policy, SAST, and
# SBOM checks are deterministic and run in the Reproducibility workflow on
# every push. This workflow holds the checks whose inputs change without a
# commit (advisory databases, registry signatures), so a new advisory opens a
# triage task instead of turning unrelated pushes red.

on:
  schedule:
    - cron: "41 17 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    name: SCA triage, registry signatures, signed SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: testing-frameworks-handbook
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@2a0be2498974c2b6327e19780488744384637d88 # v3.21.7
      - name: Install npm labs from committed locks
        run: |
          for lab in labs/node labs/advanced labs/system; do
            nix develop .#node --command npm --prefix "$lab" ci --no-audit --no-fund
          done
      - name: Verify npm registry signatures and provenance attestations
        run: |
          for lab in labs/node labs/advanced labs/system; do
            nix develop .#node --command npm --prefix "$lab" audit signatures
          done
      - name: Triage advisories against the findings ledger
        run: nix develop .#node --command node labs/security/scripts/sca-triage.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Generate, check, and sign CycloneDX SBOMs
        run: nix develop .#node --command node labs/security/scripts/sbom.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom
          path: testing-frameworks-handbook/labs/security/build/sbom/
          if-no-files-found: error
