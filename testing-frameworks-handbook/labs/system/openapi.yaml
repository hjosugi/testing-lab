openapi: 3.1.0
info:
  title: Checkout Lab API
  version: 0.1.0
paths:
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutCommand'
      responses:
        '201':
          description: Confirmed order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
components:
  schemas:
    Item:
      type: object
      required: [sku, quantity, unitPrice]
      properties:
        sku: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: integer, minimum: 0 }
    CheckoutCommand:
      type: object
      required: [orderId, token, items]
      properties:
        orderId: { type: string }
        token: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Item' }
    Order:
      type: object
      required: [orderId, total, status, paymentId]
      additionalProperties: false
      properties:
        orderId: { type: string }
        total: { type: integer, minimum: 0 }
        status: { const: CONFIRMED }
        paymentId: { type: string }

